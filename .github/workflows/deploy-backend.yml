name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend
          sparse-checkout-cone-mode: true

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_KEY }}
          source: "backend/"
          target: "~/"
          strip_components: 0
          rm: false

      - name: Install dependencies & restart server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            set -e
            cd ~/backend && .venv/bin/pip install -r requirements.txt -q
            .venv/bin/alembic upgrade head
            sudo systemctl restart cosmic-backend
            .venv/bin/python -m scripts.rewrite_aug_25_followup
            echo "서버 재시작 완료"
